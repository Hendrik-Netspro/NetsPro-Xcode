name: "🐛 Bug Report"
description: "Melde einen Fehler"
title: "[BUG]: "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was ist passiert?
      placeholder: Beschreibe den Fehler...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Reproduzieren
      placeholder: |
        1. Öffne ...
        2. Klicke auf ...
        3. Fehler tritt auf
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
      placeholder: Was sollte passieren?
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Betriebssystem
      options:
        - macOS
        - Windows
        - Linux
        - Andere
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: z. B. 1.0.0
